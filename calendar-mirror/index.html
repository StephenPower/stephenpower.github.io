<h1>calendar-mirror</h1>
<p>calendar-mirror is a personal, single-user utility. It copies the owner's own meeting times into a dedicated calendar in the owner's own Google account so that note-taking software can see them. It is not offered to the public and has no users other than its owner.</p>
